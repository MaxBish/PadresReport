name: Update Padres Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '25 13 * * *' # Daily around 6:25am PT (UTC-based)

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          git checkout main

      - name: Refresh report data from MLB Stats API
        run: |
          cd repo
          node scripts/update-report-data.mjs

      - name: Commit and push update branch
        id: commit
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C bot/update-padres-stats
          git add report-data.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: auto-update Padres stats"
          git push --force-with-lease origin bot/update-padres-stats
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd repo
          BRANCH="bot/update-padres-stats"
          HEAD_REF="${{ github.repository_owner }}:${BRANCH}"

          OPEN_PR_NUMBER=$(gh pr list \
            --base main \
            --head "$HEAD_REF" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$OPEN_PR_NUMBER" ]; then
            echo "Open PR already exists: #$OPEN_PR_NUMBER"
            gh pr view "$OPEN_PR_NUMBER" --json url --jq '.url'
            exit 0
          fi

          CLOSED_PR_NUMBER=$(gh pr list \
            --base main \
            --head "$HEAD_REF" \
            --state closed \
            --json number \
            --jq '.[0].number')

          if [ -n "$CLOSED_PR_NUMBER" ]; then
            echo "Reopening closed PR: #$CLOSED_PR_NUMBER"
            gh pr reopen "$CLOSED_PR_NUMBER"
            gh pr view "$CLOSED_PR_NUMBER" --json url --jq '.url'
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$HEAD_REF" \
            --title "chore: auto-update Padres stats" \
            --body "Automated daily refresh of Padres stats from MLB Stats API."
