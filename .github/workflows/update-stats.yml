name: Update Padres Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '25 13 * * *' # Daily around 6:25am PT (UTC-based)

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh report data from MLB Stats API
        run: node scripts/update-report-data.mjs

      - name: Create pull request for data updates
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: report-data.js
          commit-message: "chore: auto-update Padres stats"
          title: "chore: auto-update Padres stats"
          body: |
            Automated daily refresh of Padres stats from MLB Stats API.
          branch: "bot/update-padres-stats"
          delete-branch: true
